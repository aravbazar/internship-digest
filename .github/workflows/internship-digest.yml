name: Internship Digest

on:
  schedule:
    # Twice daily, in UTC. GitHub cron has no DST awareness, so both of these
    # land an hour earlier in local time once CST starts in November.
    #
    #   "45 12"  = 7:45 AM CDT / 6:45 AM CST  - overnight catch-up
    #   "45 23"  = 6:45 PM CDT / 5:45 PM CST  - same-day sweep
    #
    # To hold the local times through winter, add an hour to each: "45 13"
    # and "45 00". Note "45 00" also moves the evening run's UTC date to the
    # next day, which is expected. If you change the evening cron, update the
    # matching string in QUIET_IF_EMPTY below or the evening run will start
    # emailing on quiet days again.
    - cron: "45 12 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch:
    inputs:
      seed_only:
        description: "Record current roles as seen without emailing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: internship-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEED_ONLY: ${{ inputs.seed_only }}
          # Only the evening sweep goes quiet on a no-new-roles day. The
          # morning run always emails, so a missing morning digest means the
          # job broke rather than the day being slow. Manual runs always email.
          QUIET_IF_EMPTY: ${{ github.event.schedule == '45 23 * * *' }}
        run: python digest.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/
          git diff --staged --quiet || git commit -m "state: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
