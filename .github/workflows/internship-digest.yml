name: Daily Internship Digest

on:
  schedule:
    # Twice daily. GitHub cron is UTC and has no DST awareness, so both of
    # these land an hour earlier in local time once CST starts in November.
    # Add an hour to each ("45 13" / "45 00") in early November to hold the
    # local times below. Note "45 00" also shifts the evening run's UTC date
    # to the next day, which is expected.
    #
    # 12:45 UTC = 7:45 AM CDT / 6:45 AM CST - overnight catch-up
    - cron: "45 12 * * *"
    # 23:45 UTC = 6:45 PM CDT / 5:45 PM CST - same-day sweep
    - cron: "45 23 * * *"
  workflow_dispatch:
    inputs:
      seed_only:
        description: "Record current roles as seen without emailing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: internship-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEED_ONLY: ${{ inputs.seed_only }}
        run: python digest.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%d)"
          git push
