name: Daily Internship Digest

on:
  schedule:
    # 12:45 UTC = 7:45 AM CDT (Mar-Nov). GitHub cron has no DST awareness,
    # so this becomes 6:45 AM CST in winter. Change to "45 13 * * *" in
    # early November if you want it to stay at 7:45 local.
    - cron: "45 12 * * *"
  workflow_dispatch:
    inputs:
      seed_only:
        description: "Record current roles as seen without emailing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: internship-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEED_ONLY: ${{ inputs.seed_only }}
        run: python digest.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%d)"
          git push
